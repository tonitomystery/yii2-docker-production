server {
    charset utf-8;
    client_max_body_size 64M;
    server_name app;

    # Solo HTTP en el puerto 80: el balanceador (ALB / Elastic Beanstalk) termina TLS
    # y habla HTTP/1.1 con el contenedor. Sin 443 ni HTTP/2 dentro del contenedor:
    # - quita el warning "listen ... http2 is deprecated" de la imagen oficial
    # - deja fuera de alcance los CVE de HTTP/2 de nginx (CVE-2026-123007, CVE-2026-123633)
    listen 80 default_server;

    root        /app/web;
    index       index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.(js|css|png|jpg|gif|swf|ico|pdf|mov|fla|zip|rar|svg|woff|woff2|eot|ttf|otf)$ {
        expires 6M;
        add_header Last-Modified "";
        log_not_found off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        # Cerrar la conexión FastCGI después de cada request (default de nginx).
        # No activar: con keep_conn on aplica el request smuggling CVE-2026-129289 de PHP-FPM.
        fastcgi_keep_conn off;
        try_files $uri =404;
    }

    location ~ /\.(ht|svn|git) {
        deny all;
    }
}

; Endurecimiento PHP para producción (cargado después del resto por el prefijo zz-)

; CVE-2026-115560 / CVE-2026-126714: la subida con progreso escribe datos del cliente en la sesión.
; La app no usa upload progress de PHP; apagarlo quita esa vía. Debe ir en php.ini (ini_set llega tarde).
session.upload_progress.enabled = 0

; No anunciar la versión de PHP en el header X-Powered-By
expose_php = Off

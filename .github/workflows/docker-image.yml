name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  # Permite reconstruir manualmente desde la pestaña Actions (p. ej. tras una
  # release de seguridad de PHP en la imagen base) sin hacer commits vacíos.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: 8.5
      APACHE_VARIANT: apache-min
      NGINX_VARIANT: fpm-nginx-min
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name and short SHA
        run: |
          echo "IMAGE=${{ secrets.DOCKER_USERNAME }}/yii2-docker-prod" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Además del tag mutable (…-v1) se publica un tag inmutable con el SHA del
      # commit (…-v1-sha-abc1234) para poder desplegar una versión exacta y hacer rollback.
      - name: Build and push Docker image apache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.apache
          push: true
          pull: true
          no-cache: true
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            APACHE_VARIANT=${{ env.APACHE_VARIANT }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/yii2-docker-prod:${{ env.PHP_VERSION }}-${{ env.APACHE_VARIANT }}-${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/yii2-docker-prod:${{ env.PHP_VERSION }}-${{ env.APACHE_VARIANT }}-latest

      - name: Build and push Docker image fpm-nginx
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.fpm-nginx
          push: true
          pull: true
          no-cache: true
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            NGINX_VARIANT=${{ env.NGINX_VARIANT }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/yii2-docker-prod:${{ env.PHP_VERSION }}-${{ env.NGINX_VARIANT }}-${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/yii2-docker-prod:${{ env.PHP_VERSION }}-${{ env.NGINX_VARIANT }}-latest

name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Permite reconstruir manualmente desde la pestaña Actions (p. ej. tras una
  # release de seguridad de PHP en la imagen base) sin hacer commits vacíos.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    env:
      PHP_VERSION: ${{ matrix.php }}
      APACHE_VARIANT: apache-min
      NGINX_VARIANT: fpm-latest-nginx-min
      IMAGE_VERSION: v1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name and short SHA
        run: |
          echo "IMAGE=${{ secrets.DOCKER_USERNAME }}/yii2-docker-prod" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image apache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.apache
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          no-cache: true
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            APACHE_VARIANT=${{ env.APACHE_VARIANT }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/yii2-docker-prod:${{ env.PHP_VERSION }}-${{ env.APACHE_VARIANT }}-${{ env.IMAGE_VERSION }}

      - name: Build and push Docker image fpm-nginx
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.fpm-nginx
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          no-cache: true
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            NGINX_VARIANT=${{ env.NGINX_VARIANT }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/yii2-docker-prod:${{ env.PHP_VERSION }}-${{ env.NGINX_VARIANT }}-${{ env.IMAGE_VERSION }}

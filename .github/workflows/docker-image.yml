name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  # Permite reconstruir manualmente desde la pestaña Actions (p. ej. tras una
  # release de seguridad de PHP en la imagen base) sin hacer commits vacíos.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: 8.5
      APACHE_VARIANT: apache-min
      NGINX_VARIANT: fpm-nginx-min
      IMAGE_VERSION: v1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name and short SHA
        run: |
          echo "IMAGE=${{ secrets.DOCKER_USERNAME }}/yii2-docker-prod" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Además del tag mutable (…-v1) se publica un tag inmutable con el SHA del
      # commit (…-v1-sha-abc1234) para poder desplegar una versión exacta y hacer rollback.
      - name: Build and push Docker image apache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.apache
          push: true
          pull: true
          no-cache: true
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            APACHE_VARIANT=${{ env.APACHE_VARIANT }}
          tags: |
            ${{ env.IMAGE }}:${{ env.PHP_VERSION }}-${{ env.APACHE_VARIANT }}-${{ env.IMAGE_VERSION }}
            ${{ env.IMAGE }}:${{ env.PHP_VERSION }}-${{ env.APACHE_VARIANT }}-${{ env.IMAGE_VERSION }}-sha-${{ env.SHORT_SHA }}

      - name: Build and push Docker image fpm-nginx
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.fpm-nginx
          push: true
          pull: true
          no-cache: true
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            NGINX_VARIANT=${{ env.NGINX_VARIANT }}
          tags: |
            ${{ env.IMAGE }}:${{ env.PHP_VERSION }}-${{ env.NGINX_VARIANT }}-${{ env.IMAGE_VERSION }}
            ${{ env.IMAGE }}:${{ env.PHP_VERSION }}-${{ env.NGINX_VARIANT }}-${{ env.IMAGE_VERSION }}-sha-${{ env.SHORT_SHA }}

      # Deja en el log y en el resumen del job la versión exacta de PHP publicada,
      # para confirmar que el parche de seguridad llegó sin bajar la imagen.
      - name: Report PHP version in published images
        run: |
          {
            echo "## Imágenes publicadas"
            echo
            for variant in "$APACHE_VARIANT" "$NGINX_VARIANT"; do
              ref="$IMAGE:${PHP_VERSION}-${variant}-${IMAGE_VERSION}-sha-${SHORT_SHA}"
              echo "### \`$ref\`"
              echo '```'
              docker run --rm --entrypoint php "$ref" -v
              echo '```'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
